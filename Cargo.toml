[workspace]
members = [
    "xplainit-core",
    "xplainit-python",
    "xplainit-node",
    "xplainit-c",
    # "xplainit-cli",     # Not yet implemented
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Xplainit Contributors"]
license = "MIT"
repository = "https://github.com/yourusername/xplainit-framework"
description = "Step-by-step code execution explanation framework with natural language generation"
keywords = ["debugging", "explanation", "instrumentation", "tracing", "education"]
categories = ["development-tools", "debugging"]
readme = "README.md"

[workspace.dependencies]
# Core dependencies (shared across all crates)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

# For colored console output
colored = "2.1"
termcolor = "1.4"

# For async operations
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# For atomics and concurrency
parking_lot = "0.12"
crossbeam = "0.8"

# For configuration
config = "0.14"
toml = "0.8"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
opt-level = 3
lto = true
