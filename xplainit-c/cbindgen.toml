language = "C"

header = """
/*
 * Xplainit C/C++ FFI Bindings
 * 
 * Natural language explanations for C/C++ code execution.
 * 
 * This is an automatically generated header file.
 * Do not modify manually.
 */
"""

include_guard = "XPLAINIT_H"
pragma_once = true
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"

documentation = true
documentation_style = "c"

[export]
include = [
    "xplainit_create",
    "xplainit_free",
    "xplainit_enable",
    "xplainit_disable",
    "xplainit_is_enabled",
    "xplainit_get_events",
    "xplainit_clear_events",
    "xplainit_get_statistics",
    "xplainit_free_string",
    "xplainit_version",
]
