[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "xplainit"
version = "0.0.1"
description = "Runtime code explanation for Python - Understand what your code is doing in plain English"
authors = [{name = "Xplainit Contributors"}]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Debuggers",
]
keywords = ["debugging", "tracing", "explanation", "runtime", "instrumentation"]

[project.urls]
Homepage = "https://github.com/xplainit/xplainit"
Repository = "https://github.com/xplainit/xplainit"
Documentation = "https://xplainit.readthedocs.io"

[tool.maturin]
features = ["pyo3/extension-module"]
# Mixed Rust/Python layout: the compiled extension is merged into the
# ``xplainit`` package defined under ``python_src`` so that the pure-Python
# helper subpackage ``xplainit.python`` (tracer + decorators) ships inside the
# installed wheel. This is what lets ``xplainit.auto_trace()`` import
# ``xplainit.python.tracer`` at runtime from an installed package.
python-source = "python_src"
